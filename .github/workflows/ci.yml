name: CI - Quality, Security & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: adaptive-tutor-backend

jobs:
  # ── Backend lint + unit tests ──────────────────────────────────────────
  quality-tests:
    name: Quality & Tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Unit tests (pytest + coverage)
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Static analysis (CodeQL) ───────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ── Dependency audit (SCA) ─────────────────────────────────────────────
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend dependencies
        # Report vulnerabilities but don't fail the build on upstream CVEs.
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt -f json -o pip-audit-report.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ── Build image, scan it, smoke test the container (no registry push) ──
  build-and-smoke:
    name: Build, Scan & Smoke Test
    runs-on: ubuntu-latest
    needs:
      - quality-tests
      - sast
      - sca

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          IMAGE=${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG ./backend

      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Container smoke test (/health)
        run: |
          docker run -d -p 8000:8000 --name tutor-test \
            -e JWT_SECRET=test \
            -e GROQ_API_KEY=test \
            -e LLM_PROVIDER=groq \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=test \
            ${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl -f http://localhost:8000/health

      - name: Cleanup
        if: always()
        run: docker rm -f tutor-test || true
