services:
  db:
    image: pgvector/pgvector:pg15
    container_name: adaptive_v1_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  searxng:
    image: searxng/searxng:latest
    container_name: adaptive_v1_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng

  backend:
    build:
      context: ./backend
      args:
        # Full dependency set: keeps sentence-transformers, so RAG embedding
        # works locally. Cloud builds take the slim default.
        REQUIREMENTS: requirements.txt
    container_name: adaptive_v1_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - searxng
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
